<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MGS Team Ops — Sign in</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <style>
    :root {
      --navy: #1b2e1b;
      --green: #2e7d32;
      --green-light: #43a047;
      --yellow: #f9a825;
      --gray-200: #eeeeee;
      --gray-600: #757575;
      --gray-900: #212121;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(145deg, #1b2e1b 0%, #2e7d32 60%, #1b2e1b 100%);
      color: var(--gray-900);
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 12px;
      padding: 16px 18px 14px;
      box-shadow: 0 12px 36px rgba(0,0,0,.25);
    }
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      text-align: left;
    }
    .logo {
      flex: 0 0 auto;
      width: 88px;
      height: auto;
      display: block;
    }
    .head-text { min-width: 0; }
    .badge {
      display: inline-block;
      background: var(--yellow);
      color: #212121;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: .04em;
      margin-bottom: 4px;
    }
    .brand {
      font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--navy);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .sub {
      margin: 3px 0 0;
      color: var(--gray-600);
      font-size: 0.8rem;
      line-height: 1.3;
    }
    form { margin: 0; }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--navy);
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .pw-wrap {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }
    .pw-wrap input {
      width: 100%;
      padding: 9px 72px 9px 11px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    .pw-wrap input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(46,125,50,.15);
    }
    .toggle {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: #f3f5f3;
      color: var(--navy);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1;
    }
    .toggle:hover { background: #e5ebe5; }
    .toggle:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 1px;
    }
    button.submit {
      flex: 0 0 auto;
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    button.submit:hover { background: var(--green-light); }
    button.submit:disabled { opacity: .65; cursor: wait; }
    .err, .ok {
      display: none;
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      text-align: left;
    }
    .err { background: #ffebee; color: #b71c1c; }
    .ok { background: #e8f5e9; color: #1b5e20; }
    .err.show, .ok.show { display: block; }
    .hint {
      margin: 8px 0 0;
      font-size: 0.72rem;
      color: var(--gray-600);
      line-height: 1.3;
      text-align: center;
    }
    @media (max-width: 420px) {
      .row { flex-direction: column; }
      button.submit { width: 100%; }
      .logo { width: 72px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <img class="logo" src="/images/mgs-logo.png" width="88" height="auto" alt="MGS Communications">
      <div class="head-text">
        <div class="badge">TEAM ONLY</div>
        <div class="brand">MGS Operations</div>
        <p class="sub">Form Station &amp; team tools — not for customers.</p>
      </div>
    </div>
    <form id="loginForm" autocomplete="current-password" method="post" action="/.netlify/functions/ops-login">
      <label for="password">Team password</label>
      <div class="row">
        <div class="pw-wrap">
          <input id="password" name="password" type="password" required autofocus placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle" id="togglePw" aria-pressed="false" aria-controls="password">Show</button>
        </div>
        <button type="submit" class="submit" id="btn">Sign in</button>
      </div>
      <div class="err" id="err" role="alert"></div>
      <div class="ok" id="ok" role="status">Signed in — opening tools…</div>
    </form>
    <p class="hint" style="margin-top:12px">— or —</p>
    <p style="text-align:center;margin:0">
      <a id="googleBtn" href="/.netlify/functions/ops-google-start?next=/ops/board/" style="display:inline-block;padding:9px 14px;border-radius:8px;background:#fff;border:1.5px solid #dadce0;color:#3c4043;font-weight:600;font-size:0.88rem;text-decoration:none">
        Continue with Google
      </a>
    </p>
    <p class="hint">Password always works. Google = @mgscommunications.com only (enable in Netlify env when ready).</p>
  </main>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var err = document.getElementById('err');
      var ok = document.getElementById('ok');
      var btn = document.getElementById('btn');
      var pw = document.getElementById('password');
      var toggle = document.getElementById('togglePw');

      var params = new URLSearchParams(location.search);
      var next = params.get('next') || '/ops/forms/';
      if (next.indexOf('//') !== -1 || next.charAt(0) !== '/') next = '/ops/forms/';
      if (next !== '/ops' && next.indexOf('/ops/') !== 0) next = '/ops/forms/';

      function showErr(msg) {
        ok.classList.remove('show');
        err.textContent = msg || 'Sign-in failed';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }

      toggle.addEventListener('click', function () {
        var showing = pw.type === 'text';
        pw.type = showing ? 'password' : 'text';
        toggle.textContent = showing ? 'Show' : 'Hide';
        toggle.setAttribute('aria-pressed', showing ? 'false' : 'true');
        pw.focus();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.classList.remove('show');
        ok.classList.remove('show');
        btn.disabled = true;
        btn.textContent = '…';

        var password = pw.value;
        if (!password) {
          showErr('Enter the team password.');
          return;
        }

        fetch('/.netlify/functions/ops-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ password: password })
        })
          .then(function (res) {
            return res.text().then(function (text) {
              var data = {};
              try { data = text ? JSON.parse(text) : {}; } catch (_) {}
              return { res: res, data: data };
            });
          })
          .then(function (r) {
            if (!r.res.ok) {
              throw new Error((r.data && r.data.error) || ('Sign-in failed (' + r.res.status + ')'));
            }
            ok.classList.add('show');
            setTimeout(function () { window.location.assign(next); }, 80);
          })
          .catch(function (ex) {
            showErr((ex && ex.message) ? ex.message : 'Sign-in failed. Check your connection and try again.');
          });
      });
    })();
  </script>
</body>
</html>
