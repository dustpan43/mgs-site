<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MGS Team Ops — Sign in</title>
  <style>
    :root {
      --navy: #1b2e1b;
      --green: #2e7d32;
      --green-light: #43a047;
      --yellow: #f9a825;
      --gray-50: #fafafa;
      --gray-200: #eeeeee;
      --gray-600: #757575;
      --gray-900: #212121;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, #1b2e1b 0%, #2e7d32 55%, #1b2e1b 100%);
      color: var(--gray-900);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
    }
    .brand {
      font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--navy);
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 6px 0 22px;
      color: var(--gray-600);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--navy);
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(46,125,50,.15);
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--green-light); }
    button:disabled { opacity: .6; cursor: wait; }
    .err {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #ffebee;
      color: #b71c1c;
      font-size: 0.88rem;
    }
    .err.show { display: block; }
    .hint {
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--gray-600);
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      background: var(--yellow);
      color: #212121;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 10px;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">TEAM ONLY</div>
    <div class="brand">MGS Operations</div>
    <p class="sub">Sign in to open Form Station and other team tools. Not for customers.</p>
    <form id="loginForm" autocomplete="current-password">
      <label for="password">Team password</label>
      <input id="password" name="password" type="password" required autofocus placeholder="••••••••">
      <button type="submit" id="btn">Sign in</button>
      <div class="err" id="err" role="alert"></div>
    </form>
    <p class="hint">Missy / Angela / Dustin — same password as the team ops gate. Session lasts 30 days on this browser.</p>
  </main>
  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      var params = new URLSearchParams(location.search);
      var next = params.get('next') || '/ops/forms/';
      // Only allow relative next paths under /ops/
      if (!next.startsWith('/ops/') || next.indexOf('//') !== -1) next = '/ops/forms/';

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        err.classList.remove('show');
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        try {
          var res = await fetch('/.netlify/functions/ops-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ password: document.getElementById('password').value })
          });
          var data = {};
          try { data = await res.json(); } catch (_) {}
          if (!res.ok) {
            throw new Error(data.error || 'Sign-in failed');
          }
          location.replace(next);
        } catch (ex) {
          err.textContent = ex.message || 'Sign-in failed';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
